name: Bump Version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Create Version Bump PR
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'bump version')"

    steps:
      - uses: actions/checkout@v5

      - name: Bump patch and open PR
        run: |
          VERSION=$(cat web/package.json | jq -r .version)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          BRANCH="chore/bump-version-$NEW_VERSION"

          jq ".version = \"$NEW_VERSION\"" web/package.json > tmp.json && mv tmp.json web/package.json
          sed -i "s|<Version>.*</Version>|<Version>$NEW_VERSION</Version>|" api/OsrsTracker.Api/OsrsTracker.Api.csproj

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add web/package.json api/OsrsTracker.Api/OsrsTracker.Api.csproj
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin $BRANCH --force

          PR_EXISTS=$(gh pr list --head $BRANCH --json number --jq length)
          if [ "$PR_EXISTS" = "0" ]; then
            gh pr create \
              --title "chore: bump version to $NEW_VERSION" \
              --body "Merge this PR when ready to deploy version $NEW_VERSION." \
              --base main \
              --head $BRANCH
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
