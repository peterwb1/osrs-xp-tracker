name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  deploy-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "value=$(cat web/package.json | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/OsrsTracker.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/peterwb1/osrs-tracker-api:latest
            ghcr.io/peterwb1/osrs-tracker-api:v${{ steps.version.outputs.value }}
            ghcr.io/peterwb1/osrs-tracker-api:sha-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API Container App
        run: az containerapp update --name osrs-tracker-api --resource-group osrs-tracker-rg --image ghcr.io/peterwb1/osrs-tracker-api:sha-${{ github.sha }}

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "value=$(cat web/package.json | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/peterwb1/osrs-tracker-frontend:latest
            ghcr.io/peterwb1/osrs-tracker-frontend:v${{ steps.version.outputs.value }}
            ghcr.io/peterwb1/osrs-tracker-frontend:sha-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update frontend Container App
        run: az containerapp update --name osrs-tracker-frontend --resource-group osrs-tracker-rg --image ghcr.io/peterwb1/osrs-tracker-frontend:sha-${{ github.sha }}

  bump-version:
    name: Bump Patch Version
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Bump patch and open PR
        run: |
          VERSION=$(cat web/package.json | jq -r .version)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          BRANCH="chore/bump-version-$NEW_VERSION"

          jq ".version = \"$NEW_VERSION\"" web/package.json > tmp.json && mv tmp.json web/package.json
          sed -i "s|<Version>.*</Version>|<Version>$NEW_VERSION</Version>|" api/OsrsTracker.Api/OsrsTracker.Api.csproj

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add web/package.json api/OsrsTracker.Api/OsrsTracker.Api.csproj
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin $BRANCH

          gh pr create \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Automatic patch version bump after deployment." \
            --base main \
            --head $BRANCH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
