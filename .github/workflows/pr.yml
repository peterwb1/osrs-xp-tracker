name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "LocalDevTest#2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1434:1433

    steps:
      - uses: actions/checkout@v4

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest") \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LocalDevTest#2026!" -C -N -Q "SELECT 1" \
              && echo "SQL Server ready" && exit 0
            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done
          echo "SQL Server did not become ready in time" && exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore api/OsrsTracker.sln

      - name: Build
        run: dotnet build api/OsrsTracker.sln --no-restore -c Release

      - name: Test
        run: dotnet test api/OsrsTracker.Tests/OsrsTracker.Tests.csproj --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: false

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.azurecontainerapps.io
