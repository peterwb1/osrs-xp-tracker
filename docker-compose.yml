services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["full"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev#2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    profiles: ["full"]
    build:
      context: ./api
      dockerfile: OsrsTracker.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=db,1433;Database=osrstracker;User Id=sa;Password=LocalDev#2026!;TrustServerCertificate=True
      - Jwt__Key=dev-only-secret-key-replace-in-production-min32chars
      - Jwt__Issuer=osrs-tracker-dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  db-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDevTest#2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql_data:
